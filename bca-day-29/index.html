<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BCA Day 29 - Interactive Live Note Taker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #0b1120;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .note-app {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 28px;
      max-width: 480px;
      width: 100%;
    }
    h1 { font-size: 20px; color: #38bdf8; margin-bottom: 16px; }
    textarea {
      width: 100%;
      height: 100px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      color: white;
      font-family: inherit;
      font-size: 13px;
      resize: vertical;
      outline: none;
    }
    textarea:focus { border-color: #2563eb; }
    .counter-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 8px 0 16px;
      font-size: 12px;
      color: #94a3b8;
    }
    .warning { color: #ef4444; font-weight: bold; }
    .btn-submit {
      width: 100%;
      padding: 10px;
      background: #2563eb;
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .notes-list { margin-top: 24px; list-style: none; }
    .note-item {
      background: #0f172a;
      border-left: 3px solid #10b981;
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 8px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="note-app">
    <h1>BCA Quick Lab Note Taker</h1>
    <form id="noteForm">
      <textarea id="noteInput" maxlength="200" placeholder="Type quick lab notes (max 200 chars)..."></textarea>
      <div class="counter-row">
        <span>Character Count:</span>
        <span id="charCount">0 / 200</span>
      </div>
      <button type="submit" class="btn-submit">Add Note</button>
    </form>

    <ul class="notes-list" id="notesList"></ul>
  </div>

  <script>
    const form = document.getElementById("noteForm");
    const textarea = document.getElementById("noteInput");
    const charCount = document.getElementById("charCount");
    const notesList = document.getElementById("notesList");

    // 1. Input Event: Real-time character counter
    textarea.addEventListener("input", () => {
      const currentLength = textarea.value.length;
      charCount.textContent = `${currentLength} / 200`;
      
      // Color red if exceeds 180 characters
      if (currentLength >= 180) {
        charCount.classList.add("warning");
      } else {
        charCount.classList.remove("warning");
      }
    });

    // 2. Form Submit Event with e.preventDefault()
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = textarea.value.trim();
      if (!text) return;

      // Append new note item to DOM
      const li = document.createElement("li");
      li.className = "note-item";
      li.textContent = text;
      notesList.prepend(li);

      // Reset
      textarea.value = "";
      charCount.textContent = "0 / 200";
      charCount.classList.remove("warning");
    });
  </script>
</body>
</html>
